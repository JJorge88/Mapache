<div class="gallery-lightbox" data-gallery-lightbox hidden role="dialog" aria-modal="true" aria-label="Visor de fotografía">
  <div class="gallery-lightbox-stage"><img data-lightbox-image src="" alt=""></div>
  <button class="gallery-lightbox-close" type="button" data-lightbox-close aria-label="Regresar a los resultados"><span aria-hidden="true">←</span><span>REGRESAR</span></button>
  <button class="gallery-lightbox-arrow gallery-lightbox-prev" type="button" data-lightbox-prev aria-label="Fotografía anterior">←</button>
  <button class="gallery-lightbox-arrow gallery-lightbox-next" type="button" data-lightbox-next aria-label="Fotografía siguiente">→</button>
  <a class="gallery-lightbox-download" data-lightbox-download href="#">Descargar</a>
</div>
